    <!-- 移动端导航栏 -->
    <nav class="mobile-nav">
        <div class="nav-container">
            <li><input type="search" id="research" placeholder="  搜索"></li>
            <div class="nav-links">
                <ul class="nav-left">
                    <li class="nav-card"><a href="/myblog/blog/blog-index.html">首页</a></li>
                    <li class="nav-card"><a href="/myblog/dairy/html/dairy-write.html">笔记</a></li>

                </ul>
            </div>
            <button class="hamburger">☰</button>
        </div>
    </nav>
    <div class="container">
        <form class="post-form" id="postForm">
            <h1 class="form-title">编辑文章</h1>
            <div class="form-group">
                <input type="text" class="input-field" name="title" placeholder="输入标题（最多50字）" maxlength="50" required>
            </div>
            <div class="form-group">
                <textarea class="input-field content-input" name="content" placeholder="输入正文内容..." required></textarea>
            </div>
            <div class="form-group">
                <div class="image-upload" onclick="document.getElementById('fileInput').click()">
                    <p class="upload-text">点击选择图片或拖拽到此区域</p>
                    <!-- 上传多张图片 -->
                    <!-- <input type="file" id="fileInput" multiple accept="image/*" hidden> -->
                    <input type="file" id="fileInput" name="cover_img" accept="image/*" hidden>
                </div>
                <div class="preview-container" id="previewContainer"></div>
            </div>
            <div class="btn-container">
                <button class="delete-btn">删除</button>
                <button class="submit-btn">提交</button>
            </div>
        </form>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');

        // 图片上传处理
        fileInput.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (!file.type.startsWith('image/')) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    const preview = document.createElement('div');
                    preview.className = 'image-preview';
                    preview.innerHTML = `
                        <img src="${e.target.result}" class="preview-image">
                        <button class="remove-btn" onclick="this.parentElement.remove()">×</button>
                    `;
                    previewContainer.appendChild(preview);
                };
                reader.readAsDataURL(file);
            });
        });
    </script>
    <script type="text/javascript" src="/myblog/js/nav.js"></script>
    <script type="text/javascript" src="./js/art-edit.js"></script>
</body>
