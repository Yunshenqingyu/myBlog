<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>云深晴雨|MyBlog</title>
    <link rel="stylesheet" type="text/css" href="/myblog/css/bgi.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
        }

        .container{
            width: 25rem;
            background-color: white;
        }
        /* 头部背景 */
        .profile-header {
            height: 200px;
            background: url('https://picsum.photos/400/200') no-repeat center center;
            background-size: cover;
            position: relative;
        }

        /* 用户头像 */
        .user-avatar {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            border: 2px solid white;
            position: absolute;
            left: 20px;
            bottom: -35px;
        }

        /* 朋友圈内容区域 */
        .moment-list {
            margin-top: 50px;
            padding: 20px 15px;
        }

        /* 单条朋友圈 */
        .moment-item {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
        }

        /* 发布人头像 */
        .author-avatar {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            margin-right: 12px;
        }

        /* 发布人信息 */
        .author-info {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .author-name {
            font-weight: 500;
            font-size: 16px;
            color: #333;
        }

        .post-time {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
        }

        /* 朋友圈内容 */
        .moment-content {
            margin: 10px 0;
            font-size: 15px;
            line-height: 1.5;
            color: #333;
        }

        /* 图片网格 */
        .photo-grid {
            display: grid;
            grid-gap: 5px;
            margin: 10px 0;
        }

        .photo-item {
            width: 100%;
            height: 0;
            padding-bottom: 100%;
            position: relative;
            border-radius: 5px;
            overflow: hidden;
        }

        .photo-item img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 互动区域 */
        .interaction {
            display: flex;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        .like-btn, .comment-btn {
            display: flex;
            align-items: center;
            color: #666;
            font-size: 14px;
            margin-right: 20px;
        }

        .like-btn::before {
            content: '♥';
            margin-right: 5px;
            color: #666;
        }

        /* 点赞评论列表 */
        .like-comment-list {
            margin-top: 10px;
            background: #f8f8f8;
            border-radius: 5px;
            padding: 8px;
            font-size: 14px;
        }

        .like-item {
            color: #576b95;
            margin-bottom: 5px;
        }

        .comment-item {
            color: #333;
            margin-bottom: 5px;
        }

        /* 移动端适配 */
        
            .photo-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .moment-item {
                padding: 12px;
            }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-header">
            <img src="https://picsum.photos/70" class="user-avatar">
        </div>
    
        <div class="moment-list">
            <!-- 单条朋友圈示例 -->
            <div class="moment-item">
                <div class="author-info">
                    <img src="https://picsum.photos/40" class="author-avatar">
                    <div>
                        <div class="author-name">好友昵称</div>
                        <div class="post-time">2小时前</div>
                    </div>
                </div>
    
                <div class="moment-content">
                    这是文字内容，测试文本测试文本测试文本测试文本测试文本...
                </div>
    
                <div class="photo-grid">
                    <!-- 图片示例 -->
                    <div class="photo-item">
                        <img src="https://picsum.photos/200">
                    </div>
                    <div class="photo-item">
                        <img src="https://picsum.photos/201">
                    </div>
                    <div class="photo-item">
                        <img src="https://picsum.photos/202">
                    </div>
                </div>
    
                <div class="interaction">
                    <button class="like-btn">点赞</button>
                    <button class="comment-btn">评论</button>
                </div>
    
                <div class="like-comment-list">
                    <div class="like-item">
                        👍 用户A、用户B、用户C
                    </div>
                    <div class="comment-item">
                        <span style="color: #576b95">用户D：</span>这是一条评论示例,测试文本测试文本测试文本
                    </div>
                </div>
            </div>
    
            <!-- 更多朋友圈条目... -->
        </div>
    </div>
    
</body>
</html>
